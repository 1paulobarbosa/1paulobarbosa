name: Generate contribution snake

on:
  schedule:
    - cron: '0 3 * * *' # todo dia às 3h UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # paleta buildwithsingularity.com
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7DFFB8&color_dots=#101511,#14372A,#0E7A4A,#00C264,#00E676&color_background=#0B0E0C
            dist/github-contribution-grid-snake-dark.svg?color_snake=#7DFFB8&color_dots=#101511,#14372A,#0E7A4A,#00C264,#00E676&color_background=#0B0E0C

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
